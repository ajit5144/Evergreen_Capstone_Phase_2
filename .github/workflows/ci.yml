# Evergreen Quote - provided CI workflow (Phase 2).
# Capstone learners: enable this by copying it to .github/workflows/ci.yml
# in your repo and pushing. Do not modify the workflow itself.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    name: Greetings
    run: echo "Hello, Evergreen Quote Capstone learners! This is your CI workflow running. ${{github.actor}} is the actor, and this is the event: ${{github.event_name}}."
    
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ./starter/package-lock.json

      - name: Install dependencies from the lock file
        run: npm ci
        working-directory: ./starter

      - name: Type-check (the contracts must hold)
        run: npm run type-check
        working-directory: ./starter

      - name: Production build
        run: npm run build
        working-directory: ./starter
